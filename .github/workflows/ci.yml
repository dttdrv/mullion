name: CI Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # every pull request builds each variant, runs the host tests (including ASan+UBSan) and leaves its archive as an
  # artifact. the GPU tests do not run for one: GitHub's Macs have no GPU Mullion runs on, and a self-hosted one must
  # not run a fork's code
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**']
  # GitHub removes a cache nothing has read for 7 days, and a tag's run reads only the caches of the default branch:
  # every 5 days the toolchains are read there (keep-toolchains), and made again where one is gone
  schedule:
    - cron: '17 3 */5 * *'

# a pull request's newer push ends the run of the one before
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: read
  attestations: write
  id-token: write

env:
  LLVM_VERSION: llvmorg-15.0.7
  WINE_VERSION: v8.16-3shain
  WINE_URL: https://github.com/3Shain/wine/releases/download/v8.16-3shain/wine.tar.gz
  WINE_ARM64EC_VERSION: wine-11.2
  WINE_ARM64EC_URL: https://github.com/3Shain/wine/releases/download/wine-11.2/wine-11.2.tar.gz
  LLVM_MINGW_VERSION: "20260908"
  LLVM_MINGW_DIR: llvm-mingw-20260908-ucrt-macos-universal
  CCACHE_DIR: /tmp/mullion-ccache
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "1G"
  CCACHE_COMPILERCHECK: "%compiler% -v"
  CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"

jobs:
  # Toolchain cache population and 5-day keepalive: only runs on schedule or manual dispatch, so PRs do not burn 7
  # macOS runner slots on cache lookups before builds can start.
  setup-wine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Cache Wine
        id: cache-wine
        uses: actions/cache@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          restore-keys: |
            wine-x86_64-${{ env.WINE_VERSION }}-
          lookup-only: true
          path: ./toolchains/wine

      - name: Install Wine
        if: steps.cache-wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_URL }} | tar -zxf - -C ./toolchains/wine

      - name: Save Cache
        if: steps.cache-wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

  setup-wine-arm64ec:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Cache Wine (ARM64EC)
        id: cache-wine-arm64ec
        uses: actions/cache@v5
        with:
          key: wine-arm64ec-${{ env.WINE_ARM64EC_VERSION }}-macos
          restore-keys: |
            wine-arm64ec-${{ env.WINE_ARM64EC_VERSION }}-
          lookup-only: true
          path: ./toolchains/wine

      - name: Install Wine (ARM64EC)
        if: steps.cache-wine-arm64ec.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_ARM64EC_URL }} | tar -zxf - --strip-components 2 -C ./toolchains/wine

      - name: Save Cache
        if: steps.cache-wine-arm64ec.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: wine-arm64ec-${{ env.WINE_ARM64EC_VERSION }}-macos
          path: ./toolchains/wine

  setup-llvm-mingw:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Cache LLVM-MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          restore-keys: |
            llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-
          lookup-only: true
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Install LLVM-MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VERSION }}/${{ env.LLVM_MINGW_DIR }}.tar.xz | tar -Jxf - -C ./toolchains

      - name: Save Cache
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

  setup-llvm-project:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Cache LLVM Project
        id: cache-llvm-project
        uses: actions/cache@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          restore-keys: |
            llvm-project-${{ env.LLVM_VERSION }}-
          lookup-only: true
          path: ./toolchains/llvm-project

      - name: Clone LLVM Project
        if: steps.cache-llvm-project.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project.git toolchains/llvm-project

      - name: Save Cache
        if: steps.cache-llvm-project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

  setup-llvm-darwin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    needs: setup-llvm-project
    steps:
      - name: Cache LLVM Darwin Build
        id: cache-llvm-darwin
        uses: actions/cache@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          restore-keys: |
            llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-
          lookup-only: true
          path: ./toolchains/llvm-darwin

      - name: Restore LLVM Project
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

      - name: Build LLVM for Darwin (x86_64)
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/llvm-darwin-build
          cmake -B ./toolchains/llvm-darwin-build -S ./toolchains/llvm-project/llvm \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/toolchains/llvm-darwin" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DLLVM_HOST_TRIPLE=x86_64-apple-darwin \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -DBUG_REPORT_URL="https://github.com/dttdrv/mullion" \
            -DPACKAGE_VENDOR="Mullion" \
            -DLLVM_VERSION_PRINTER_SHOW_HOST_TARGET_INFO=Off \
            -G Ninja
          cmake --build ./toolchains/llvm-darwin-build
          cmake --install ./toolchains/llvm-darwin-build

      - name: Save Cache
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin

  setup-llvm-win:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    needs: [setup-llvm-project, setup-llvm-mingw]
    steps:
      - name: Cache LLVM Windows Build
        id: cache-llvm-win
        uses: actions/cache@v5
        with:
          key: llvm-win-${{ env.LLVM_VERSION }}-x86_64-w64-mingw32-macos
          restore-keys: |
            llvm-win-${{ env.LLVM_VERSION }}-x86_64-w64-mingw32-
          lookup-only: true
          path: ./toolchains/llvm

      - name: Restore LLVM Project
        if: steps.cache-llvm-win.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

      - name: Restore LLVM-MinGW Cache
        if: steps.cache-llvm-win.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Build LLVM for Windows
        if: steps.cache-llvm-win.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/llvm-build
          cmake -B ./toolchains/llvm-build -S ./toolchains/llvm-project/llvm -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/toolchains/llvm" \
            -DLLVM_HOST_TRIPLE=x86_64-w64-mingw32 \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -DCMAKE_SYSROOT="$(pwd)/toolchains/${{ env.LLVM_MINGW_DIR }}" \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_FLAGS="-include type_traits" \
            -DLLVM_INCLUDE_BENCHMARKS=Off \
            -DBUG_REPORT_URL="https://github.com/dttdrv/mullion" \
            -DPACKAGE_VENDOR="Mullion" \
            -DLLVM_VERSION_PRINTER_SHOW_HOST_TARGET_INFO=Off \
            -G Ninja
          cmake --build ./toolchains/llvm-build
          cmake --install ./toolchains/llvm-build

      - name: Save Cache
        if: steps.cache-llvm-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-win-${{ env.LLVM_VERSION }}-x86_64-w64-mingw32-macos
          path: ./toolchains/llvm

  setup-llvm-darwin-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    needs: setup-llvm-project
    steps:
      - name: Cache LLVM Darwin Build (ARM64)
        id: cache-llvm-darwin-arm64
        uses: actions/cache@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-arm64-macos
          restore-keys: |
            llvm-darwin-${{ env.LLVM_VERSION }}-arm64-
          lookup-only: true
          path: ./toolchains/llvm-darwin-arm64

      - name: Restore LLVM Project
        if: steps.cache-llvm-darwin-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

      - name: Build LLVM for Darwin (arm64)
        if: steps.cache-llvm-darwin-arm64.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/llvm-darwin-arm64-build
          cmake -B ./toolchains/llvm-darwin-arm64-build -S ./toolchains/llvm-project/llvm \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/toolchains/llvm-darwin-arm64" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLLVM_HOST_TRIPLE=arm64-apple-darwin \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -DBUG_REPORT_URL="https://github.com/dttdrv/mullion" \
            -DPACKAGE_VENDOR="Mullion" \
            -DLLVM_VERSION_PRINTER_SHOW_HOST_TARGET_INFO=Off \
            -G Ninja
          cmake --build ./toolchains/llvm-darwin-arm64-build
          cmake --install ./toolchains/llvm-darwin-arm64-build

      - name: Save Cache
        if: steps.cache-llvm-darwin-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-arm64-macos
          path: ./toolchains/llvm-darwin-arm64

  # reads each toolchain cache, which counts as its use: a cache that is only looked up may not
  keep-toolchains:
    if: github.event_name == 'schedule'
    runs-on: macos-26
    needs: [setup-wine, setup-wine-arm64ec, setup-llvm-mingw, setup-llvm-darwin, setup-llvm-win, setup-llvm-darwin-arm64]
    steps:
      - uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine
      - uses: actions/cache/restore@v5
        with:
          key: wine-arm64ec-${{ env.WINE_ARM64EC_VERSION }}-macos
          path: ./toolchains/wine
      - uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}
      - uses: actions/cache/restore@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project
      - uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin
      - uses: actions/cache/restore@v5
        with:
          key: llvm-win-${{ env.LLVM_VERSION }}-x86_64-w64-mingw32-macos
          path: ./toolchains/llvm
      - uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-arm64-macos
          path: ./toolchains/llvm-darwin-arm64

  # Fast Linux checks: Python syntax, conformance JSON validity, and fault patches touched by the PR.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Python scripts and conformance JSON
        run: |
          python3 -m py_compile tests/*.py tests/host/*.py tools/*.py .github/*.py
          python3 -c '
          import glob, json
          for p in sorted(glob.glob("tests/conformance/*.json")):
              json.load(open(p))
          print("conformance JSONs valid")
          '

      - name: Check fault patches touched by PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=AM FETCH_HEAD...HEAD -- 'tests/breaks/*.patch')
          if [ -z "$changed" ]; then
            echo "No fault patches added or modified."
            exit 0
          fi
          fail=0
          for p in $changed; do
            if ! git apply --check "$p"; then
              echo "::error file=$p::Fault patch does not apply cleanly"
              fail=1
            fi
          done
          exit $fail

  # Builds both x86_64 and x86 (WoW64) GCC release in one macOS runner slot.
  build-gcc-release-windows-cross:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore Wine Cache
        id: wine
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

      - name: Download Wine (cache miss fallback)
        if: steps.wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_URL }} | tar -zxf - -C ./toolchains/wine

      - name: Restore LLVM Darwin Cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          fail-on-cache-miss: true
          path: ./toolchains/llvm-darwin

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-gcc-release-${{ github.sha }}
          restore-keys: |
            ccache-v1-gcc-release-

      - name: Install mingw-w64 and ccache
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: mingw-w64 ccache

      - name: Select Xcode Version
        run: .github/select-xcode.sh

      - name: Install Meson
        run: pip3 install meson==1.10.0 --break-system-packages

      - name: Build Win64 and WoW64
        run: |
          . .github/setup-ccache.sh
          ccache -z
          meson setup --cross-file build-win64.txt -Denable_nvapi=true -Denable_nvngx=true -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine build64 --buildtype release --prefix $(pwd)/install64 --strip
          meson compile -C build64
          meson install -C build64
          meson setup --cross-file build-win32.txt -Dwine_install_path=toolchains/wine build32 --buildtype release --prefix $(pwd)/install32 --strip
          meson compile -C build32
          meson install -C build32
          ccache -s

      - name: Upload Win64
        uses: actions/upload-artifact@v6
        with:
          name: gcc-release-x86_64-windows-cross
          path: install64

      - name: Upload WoW64
        uses: actions/upload-artifact@v6
        with:
          name: gcc-release-x86-windows-cross
          path: install32

  # Builds both x86_64 and x86 (WoW64) Clang release in one macOS runner slot.
  build-clang-release-windows-cross:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore Wine Cache
        id: wine
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

      - name: Download Wine (cache miss fallback)
        if: steps.wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_URL }} | tar -zxf - -C ./toolchains/wine

      - name: Restore LLVM-MinGW Cache
        id: llvm-mingw
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Download LLVM-MinGW (cache miss fallback)
        if: steps.llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VERSION }}/${{ env.LLVM_MINGW_DIR }}.tar.xz | tar -Jxf - -C ./toolchains

      - name: Restore LLVM Darwin Cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          fail-on-cache-miss: true
          path: ./toolchains/llvm-darwin

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-clang-release-x86-${{ github.sha }}
          restore-keys: |
            ccache-v1-clang-release-x86-

      - name: Install ccache
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ccache

      - name: Select Xcode Version
        run: .github/select-xcode.sh

      - name: Install Meson
        run: pip3 install meson==1.10.0 --break-system-packages

      - name: Build Win64 and WoW64
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          . .github/setup-ccache.sh
          ccache -z
          meson setup --cross-file build-win64.txt -Denable_nvapi=true -Denable_nvngx=true -Denable_d3d12=true -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine build64 --buildtype release --prefix $(pwd)/install64 --strip
          meson compile -C build64
          meson install -C build64
          meson setup --cross-file build-win32.txt -Dwine_install_path=toolchains/wine build32 --buildtype release --prefix $(pwd)/install32 --strip
          meson compile -C build32
          meson install -C build32
          ccache -s

      - name: Upload Win64
        uses: actions/upload-artifact@v6
        with:
          name: clang-release-x86_64-windows-cross
          path: install64

      - name: Upload WoW64
        uses: actions/upload-artifact@v6
        with:
          name: clang-release-x86-windows-cross
          path: install32

  build-clang-debugoptimized-x86_64-windows-cross:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore Wine Cache
        id: wine
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

      - name: Download Wine (cache miss fallback)
        if: steps.wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_URL }} | tar -zxf - -C ./toolchains/wine

      - name: Restore LLVM-MinGW Cache
        id: llvm-mingw
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Download LLVM-MinGW (cache miss fallback)
        if: steps.llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VERSION }}/${{ env.LLVM_MINGW_DIR }}.tar.xz | tar -Jxf - -C ./toolchains

      - name: Restore LLVM Darwin Cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          fail-on-cache-miss: true
          path: ./toolchains/llvm-darwin

      - name: Restore LLVM Windows Cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-win-${{ env.LLVM_VERSION }}-x86_64-w64-mingw32-macos
          fail-on-cache-miss: true
          path: ./toolchains/llvm

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-clang-dbgopt-x64-${{ github.sha }}
          restore-keys: |
            ccache-v1-clang-dbgopt-x64-

      - name: Install ccache
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ccache

      - name: Select Xcode Version
        run: .github/select-xcode.sh

      - name: Install Meson
        run: pip3 install meson==1.10.0 --break-system-packages

      - name: Build
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          . .github/setup-ccache.sh
          ccache -z
          meson setup --cross-file build-win64.txt -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine -Dbuild_airconv_for_windows=true -Denable_nvapi=true -Denable_nvngx=true -Denable_d3d12=true build --buildtype debugoptimized --prefix $(pwd)/install
          meson compile -C build
          meson install -C build
          ccache -s

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: clang-debugoptimized-x86_64-windows-cross
          path: install

  # Mullion's host tests: compiles ONLY the host suite targets (skipping 300+ GPU test exes), runs them with assertions
  # enabled, then runs the native C/C++ host tests a second time under ASan + UBSan.
  test-host:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore Wine Cache
        id: wine
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

      - name: Download Wine (cache miss fallback)
        if: steps.wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fsSL ${{ env.WINE_URL }} | tar -zxf - -C ./toolchains/wine

      - name: Restore LLVM-MinGW Cache
        id: llvm-mingw
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Download LLVM-MinGW (cache miss fallback)
        if: steps.llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VERSION }}/${{ env.LLVM_MINGW_DIR }}.tar.xz | tar -Jxf - -C ./toolchains

      - name: Restore LLVM Darwin Cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          fail-on-cache-miss: true
          path: ./toolchains/llvm-darwin

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-test-host-${{ github.sha }}
          restore-keys: |
            ccache-v1-test-host-

      - name: Install ccache
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ccache

      - name: Select Xcode Version
        run: .github/select-xcode.sh

      - name: Install Meson
        run: pip3 install meson==1.10.0 --break-system-packages

      - name: Build and run host tests (assertions on)
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          . .github/setup-ccache.sh
          ccache -z
          meson setup --cross-file build-win64.txt -Denable_tests=true -Db_ndebug=false -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine build --buildtype release
          python3 .github/compile-host-tests.py build
          meson test -C build --suite host --no-rebuild --print-errorlogs
          ccache -s

      - name: Build and run host tests under ASan + UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          . .github/setup-ccache.sh
          meson setup --cross-file build-win64.txt -Denable_tests=true -Db_ndebug=false \
            -Dbuild.c_args="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -Dbuild.cpp_args="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -Dbuild.c_link_args="-fsanitize=address,undefined" \
            -Dbuild.cpp_link_args="-fsanitize=address,undefined" \
            -Dnative_llvm_path=toolchains/llvm-darwin -Dwine_install_path=toolchains/wine build-san --buildtype debugoptimized
          python3 .github/compile-host-tests.py build-san
          # Run every host test under ASan+UBSan except host_tessellator (4+ min exhaustive math, already verified above)
          # and host_metal_target (inspects the cross-compiled Windows DLL).
          meson test -C build-san --suite host --no-rebuild --print-errorlogs \
            $(python3 -c '
          import json, subprocess
          tests = json.loads(subprocess.check_output(["meson", "introspect", "--tests", "build-san"], text=True))
          skip = {"host_tessellator", "host_metal_target"}
          print(" ".join(t["name"] for t in tests if any(s == "host" or s.endswith(":host") for s in t.get("suite", [])) and t["name"] not in skip))
          ')
          ccache -s

  test-gpu:
    if: vars.MULLION_WINE != '' && github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build with tests
        run: |
          meson setup --cross-file build-win64.txt -Denable_tests=true -Denable_nvapi=true -Db_ndebug=false -Dnative_llvm_path="${{ vars.MULLION_LLVM }}" -Dwine_install_path="${{ vars.MULLION_WINE }}" build --buildtype release
          meson compile -C build

      # as the GPU itself and as an M3's, the families the preview supports, under Metal's validation
      - name: Tests
        env:
          MULLION_TEST_LOCK: ${{ runner.temp }}/mullion-gpu.lock
        run: python3 tests/run.py --build build --wine "${{ vars.MULLION_WINE }}" --prefix "${{ vars.MULLION_PREFIX }}" --family native,9 --validate

      - name: Benchmarks
        env:
          MULLION_TEST_LOCK: ${{ runner.temp }}/mullion-gpu.lock
        run: python3 tests/run.py --build build --wine "${{ vars.MULLION_WINE }}" --prefix "${{ vars.MULLION_PREFIX }}" --family native --benchmark

      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-tests
          path: |
            build/meson-logs/tests
            build/meson-logs/benchmarks

