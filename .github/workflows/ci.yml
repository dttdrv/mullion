  # the release archive: x86_64 for Wine and CrossOver on Rosetta with the 32-bit Direct3D 10 and 11 for their 32-bit
  # programs, and ARM64X for arm64 Wine, whose x86_64 programs load it as ARM64EC. runs on ubuntu-latest so it consumes
  # zero macOS runner slots.
  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [build-gcc-release-windows-cross, build-clang-release-arm64ec-windows-cross]
    env:
      PACKAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Win64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: gcc-release-x86_64-windows-cross
          path: ./combined/${{ env.PACKAGE_TAG }}

      - name: Download WoW64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: gcc-release-x86-windows-cross
          path: ./combined/${{ env.PACKAGE_TAG }}

      - name: Download ARM64X Artifact
        uses: actions/download-artifact@v8
        with:
          name: clang-release-arm64ec-windows-cross
          path: ./combined/${{ env.PACKAGE_TAG }}

      - name: Check ARM64X and archive contents
        run: |
          dir=./combined/${{ env.PACKAGE_TAG }}
          python3 .github/check-arm64x.py "$dir"/aarch64-windows/*.dll
          for f in \
            x86_64-windows/d3d10core.dll x86_64-windows/d3d11.dll x86_64-windows/d3d12.dll \
            x86_64-windows/dxgi.dll x86_64-windows/nvapi64.dll x86_64-windows/nvngx.dll \
            x86_64-unix/winemetal.so \
            i386-windows/d3d10core.dll i386-windows/d3d11.dll i386-windows/dxgi.dll \
            aarch64-windows/d3d10core.dll aarch64-windows/d3d11.dll aarch64-windows/d3d12.dll \
            aarch64-windows/dxgi.dll aarch64-windows/nvapi64.dll aarch64-windows/nvngx.dll \
            aarch64-unix/winemetal.so; do
            test -f "$dir/$f" || { echo "::error::missing $f in package"; exit 1; }
          done

      # NGX loads only a core whose signature chains to a trusted root: nvngx.dll is signed with Mullion's NGX key
      # (src/nvngx/signing), whose certificate DXGI trusts in the prefix with MULLION_ENABLE_NVEXT=1. Without the
      # MULLION_NGX_SIGNING_KEY secret (a fork's run) the archive has it unsigned, which NGX refuses
      - name: Sign NGX
        env:
          MULLION_NGX_SIGNING_KEY: ${{ secrets.MULLION_NGX_SIGNING_KEY }}
        run: |
          if [ -z "$MULLION_NGX_SIGNING_KEY" ]; then
            echo "::warning::MULLION_NGX_SIGNING_KEY is not set: nvngx.dll stays unsigned, and NGX will not load it"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          key=$(mktemp)
          printf '%s\n' "$MULLION_NGX_SIGNING_KEY" > "$key"
          for dll in ./combined/${{ env.PACKAGE_TAG }}/*-windows/nvngx.dll; do
            osslsigncode sign -certs src/nvngx/signing/mullion-ngx.pem -key "$key" -n "Mullion NGX" -h sha256 \
              -in "$dll" -out "$dll.signed"
            mv "$dll.signed" "$dll"
            osslsigncode verify -CAfile src/nvngx/signing/mullion-ngx.pem -in "$dll"
          done
          rm -f "$key"

      - name: Add Installer and Licences
        run: |
          dir=./combined/${{ env.PACKAGE_TAG }}
          cp install.sh README.md LICENSE "$dir/"
          cp -R docs/licenses "$dir/licenses"
          # airconv links LLVM in
          curl -fsSL "https://raw.githubusercontent.com/llvm/llvm-project/${{ env.LLVM_VERSION }}/llvm/LICENSE.TXT" \
            > "$dir/LICENSE-LLVM.txt"

      - name: Create Tarball
        run: tar -czf mullion-${{ env.PACKAGE_TAG }}.tar.gz -C ./combined --exclude='*.a' ${{ env.PACKAGE_TAG }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: mullion-${{ env.PACKAGE_TAG }}.tar.gz

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v6
        with:
          name: mullion-${{ env.PACKAGE_TAG }}
          path: mullion-${{ env.PACKAGE_TAG }}.tar.gz

      - name: Draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$PACKAGE_TAG" "mullion-$PACKAGE_TAG.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$PACKAGE_TAG" "mullion-$PACKAGE_TAG.tar.gz" --repo "$GITHUB_REPOSITORY" --draft \
              --prerelease --title "Mullion $PACKAGE_TAG" --notes ""
          fi
